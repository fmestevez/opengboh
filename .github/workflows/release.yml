# Builds opengboh for macOS, Windows and Linux and publishes the programs
# on a GitHub release, when a version tag (v1.2.3) is pushed or by hand.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish the release under (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            archive: opengboh-macos-arm64.tar.gz
          - name: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
            archive: opengboh-macos-x86_64.tar.gz
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: opengboh-windows-x86_64.zip
          - name: Linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: opengboh-linux-x86_64.tar.gz
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev libx11-dev

      - name: Build
        run: cargo build --release --locked -p gboh-viewer --target ${{ matrix.target }}

      - name: Package (macOS, Linux)
        if: runner.os != 'Windows'
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/opengboh README.md LICENSE dist/
          cp docs/running-originals.md dist/
          tar -czf ${{ matrix.archive }} -C dist .

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/${{ matrix.target }}/release/opengboh.exe, README.md, LICENSE, docs/running-originals.md dist/
          Compress-Archive -Path dist/* -DestinationPath ${{ matrix.archive }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: opengboh ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          body: |
            Download the archive for your system, unpack it and run `opengboh`.
            You need your own copy of The Great Battles of Alexander, Hannibal
            or Caesar: opengboh asks for its folder on first start.

            macOS: the program isn't signed; if macOS refuses to open it, run
            `xattr -d com.apple.quarantine opengboh` in its folder.
          files: artifacts/*
